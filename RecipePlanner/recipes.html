<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Browse recipes by category with Recipe Planner."
  >

  <title>Recipes | Recipe Planner</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="site-header">
    <div class="container header-content">

      <a href="index.html" class="logo">
        <span class="logo-icon" aria-hidden="true">🍽️</span>
        <span>Recipe Planner</span>
      </a>

      <button
        class="menu-button"
        id="menu-button"
        type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
      >
        ☰
      </button>

      <nav class="main-nav" id="main-nav">
        <a href="index.html">Home</a>
        <a href="recipes.html">Recipes</a>
        <a href="favorites.html">Favorites</a>
        <a href="meal-planner.html">Meal Planner</a>
      </nav>

    </div>
  </header>

  <main>

    <section class="page-header">
      <div class="container">

        <p class="eyebrow">DISCOVER</p>

        <h1>Browse Recipes</h1>

        <p>
          Explore recipes by category and find something delicious to cook.
        </p>

        <div id="category-buttons" class="category-buttons">
          <p class="empty-message">Loading categories...</p>
        </div>

      </div>
    </section>

    <section class="recipes-section">
      <div class="container">

        <div
          id="category-results"
          class="recipe-grid"
          aria-live="polite"
        ></div>

      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Recipe Planner. Built for WDD 330.</p>
      <p>Recipe data provided by TheMealDB.</p>
    </div>
  </footer>

  <script type="module" src="js/recipes.js"></script>

</body>

</html>
